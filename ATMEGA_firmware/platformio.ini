; ATmega328P firmware v2 - traffic light add-on, "sync pulse" design.
; Register-level (bare metal) C, NO Arduino framework. Only avr-libc headers are used.
; Based on the team-mate's prototype (README/atmega_controller): the ATmega sleeps almost all the
; time, the traffic light controller wakes it with a pulse on D3, and the ESP32-CAM reports the
; traffic density over I2C.
;
;   pio run -e release             real schedule, RTC must already hold the right time
;   pio run -e bench               bench test: RTC forced to 15:59:00 at every boot, 1-minute windows
;   pio run -e settime -t upload   upload once to set the RTC to the PC time, then flash "release"
;   pio test -e native             unit tests of lib/tlc_schedule on the PC (needs a host C compiler)
;
; "board = uno" is only used for its chip settings (ATmega328P, 16 MHz) and upload settings
; (Optiboot, 115200 baud). Without "framework" nothing from Arduino is compiled.

[platformio]
default_envs = release

[common]
build_flags =
    -std=gnu99
    -Wall
    -Wextra
    -Os

[env:release]
platform = atmelavr
board = uno
build_flags = ${common.build_flags}

[env:bench]
platform = atmelavr
board = uno
build_flags =
    ${common.build_flags}
    -DTEST_MODE=1

[env:settime]
platform = atmelavr
board = uno
build_flags =
    ${common.build_flags}
    -DSET_RTC_FROM_BUILD=1

[env:native]
platform = native
test_framework = unity
build_flags =
    -std=gnu99
    -Wall
    -Wextra
    -Ilib/tlc_schedule
