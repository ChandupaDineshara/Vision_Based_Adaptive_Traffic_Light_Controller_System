; ATmega328P main program of the traffic light add-on (Arduino core for the serial monitor and
; start-up, register-level hardware layer for everything else).
;
;   pio run                 build
;   pio run -t upload       upload through the Optiboot bootloader (reset button at upload start)
;   pio device monitor      terminal output, 19200 baud
;
; Layout: src/main.cpp is the flow (setup() and loop()); lib/hal, lib/ds3231 and lib/esp_link are the
; hardware layer and drivers. The logic is unchanged from the team's tested program.
;
; "board = uno" gives the chip settings (ATmega328P, 16 MHz crystal) and the bootloader upload
; settings. The program divides the 16 MHz crystal by 4 at start-up (hal_clock.c), so the CPU runs at
; 4 MHz; hal_f_cpu.h tells the hardware layer the real clock. Because of that the monitor speed is 19200.

[platformio]
default_envs = atmega328p

[env:atmega328p]
platform = atmelavr
board = uno
framework = arduino
monitor_speed = 19200
build_flags =
    -Wall
; Link the library objects directly instead of through archives. hal_clock.c contains a start-up
; function (hal_clock_early, section .init3) that nothing calls by name; from an archive the linker
; would leave it out and the CPU would stay at 16 MHz.
lib_archive = no
