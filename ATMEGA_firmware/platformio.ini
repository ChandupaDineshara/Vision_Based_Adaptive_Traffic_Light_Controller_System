; ATmega328P firmware for the adaptive traffic light controller add-on.
; Specification: docs/ (start with 01_system_overview.md)
;
;   pio run -e release          production build
;   pio run -e debug            adds the trace output on the debug pin (see src/debug.h)
;   pio run -e release -t upload
;   pio test -e native          unit tests of lib/tlc_core on the PC (needs a host C++ compiler)

[platformio]
default_envs = release

[common]
build_flags =
    -Wall
    -Wextra

[env:release]
platform = atmelavr
board = uno
framework = arduino
build_flags = ${common.build_flags}

[env:debug]
platform = atmelavr
board = uno
framework = arduino
build_flags =
    ${common.build_flags}
    -DTLC_DEBUG=1

; Bench only: sets the DS3231 to the PC time at build time on every boot.
; Upload once, then switch back to the release env. Never use in the field.
[env:settime]
platform = atmelavr
board = uno
framework = arduino
build_flags =
    ${common.build_flags}
    -DTLC_DEBUG=1
    -DTLC_SET_RTC_FROM_BUILD=1

[env:native]
platform = native
test_framework = unity
build_flags =
    -std=gnu++11
    -Wall
    -Wextra
    -Iinclude
    -Ilib/tlc_core
