; ESP32-CAM (AI-Thinker) firmware: photographs the road, estimates the traffic density and gives
; it to the ATmega over I2C. Same design as the team-mate's reference (README/esp32_cam_node),
; with the vision algorithm (lib/density) inserted. See README.md.
;
;   pio run                       build
;   pio run -t upload             upload (GPIO0 to GND while resetting, see README.md)
;   pio device monitor            serial output at 115200 baud
;   pio test -e native            unit tests of lib/density on the PC (needs a host C++ compiler)

[platformio]
default_envs = esp32cam

[env:esp32cam]
platform = espressif32@6.5.0
board = esp32cam
framework = arduino
monitor_speed = 115200
build_flags =
    -Wall
    -Wextra

[env:native]
platform = native
test_framework = unity
build_flags =
    -std=gnu++11
    -Wall
    -Wextra
    -Ilib/density
