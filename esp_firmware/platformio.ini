; ESP32-CAM (AI-Thinker) firmware: photographs the road, estimates the traffic density and
; gives it to the ATmega over I2C. See README.md and docs/.
;
;   pio run -e field                  normal build: no Wi-Fi
;   pio run -e field -t upload        upload (GPIO0 to GND while resetting, see README.md)
;   pio run -e tuning                 same, plus: every photo is sent to the laptop over Wi-Fi
;                                     (needs include/secrets.h, copy secrets.example.h)
;   pio test -e native                unit tests of lib/density on the PC (needs a host C++ compiler)
;
; The platform version is pinned so builds are reproducible (Arduino-ESP32 core 2.0.x).

[platformio]
default_envs = field

[common]
platform = espressif32@6.5.0
board = esp32cam
framework = arduino
monitor_speed = 115200
build_flags =
    -Wall
    -Wextra

[env:field]
platform = ${common.platform}
board = ${common.board}
framework = ${common.framework}
monitor_speed = ${common.monitor_speed}
build_flags =
    ${common.build_flags}

[env:tuning]
platform = ${common.platform}
board = ${common.board}
framework = ${common.framework}
monitor_speed = ${common.monitor_speed}
build_flags =
    ${common.build_flags}
    -DUPLOAD_PHOTOS=1

[env:native]
platform = native
test_framework = unity
build_flags =
    -std=gnu++11
    -Wall
    -Wextra
    -Ilib/density
