; Arduino Uno that plays the EXISTING traffic light controller (ETLC) in the test set-up:
; it sends the wake pulse to the ATmega over RS-485, receives "DENSITY n" and answers "ACK n".
;
;   pio run                 build
;   pio run -t upload       upload to the Uno
;   pio device monitor      serial output, 9600 baud
;
; The program is src/main.cpp (setup() and loop()); the logic is unchanged from the team's tested
; sketch. SoftwareSerial is part of the Arduino AVR core, so no library has to be installed.

[platformio]
default_envs = uno

[env:uno]
platform = atmelavr
board = uno
framework = arduino
monitor_speed = 9600
build_flags =
    -Wall
